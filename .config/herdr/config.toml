# Keep Herdr's workspace, pane, and tab keys aligned with Zellij where they
# differ. Herdr's native Ctrl-b prefix and Ctrl-b Ctrl-b passthrough remain.
onboarding = false

[keys]

# Tabs
rename_tab = ["prefix+shift+t", "prefix+comma"]
previous_tab = ["prefix+p", "alt+["]
next_tab = ["prefix+n", "alt+]"]

# Panes
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
cycle_pane_next = ["prefix+tab", "prefix+o"]
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
resize_mode = ["prefix+r", "ctrl+n"]

# Workspaces
workspace_picker = ["prefix+w", "ctrl+o"]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
