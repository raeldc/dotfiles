# Keep Herdr's workspace, pane, and tab keys aligned with Zellij where they
# differ. Herdr's native Ctrl-b prefix and Ctrl-b Ctrl-b passthrough remain.
onboarding = false

[ui]
pane_borders = true
pane_gaps = false

agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
[keys]

# Tabs
rename_tab = ["prefix+shift+t", "prefix+comma"]
previous_tab = ["prefix+p", "alt+["]
next_tab = ["prefix+n", "alt+]"]

# Panes
focus_pane_left = ["prefix+h", "prefix+left", "alt+h"]
focus_pane_down = ["prefix+j", "prefix+down", "alt+j"]
focus_pane_up = ["prefix+k", "prefix+up", "alt+k"]
focus_pane_right = ["prefix+l", "prefix+right", "alt+l"]
cycle_pane_next = ["prefix+tab", "prefix+o"]
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
resize_mode = ["prefix+r", "ctrl+n"]

# Workspaces
workspace_picker = ["prefix+w", "ctrl+o"]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
switch_workspace = "prefix+shift+1..9"
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"
previous_agent = "alt+shift+h"
next_agent = "alt+shift+l"
focus_agent = "prefix+alt+1..9"

[theme]
name = "tokyo-night"
auto_switch = false

[ui.toast]
delivery = "system"

[session]
resume_agents_on_restore = true

[[keys.command]]
key = "prefix+|"
type = "plugin_action"
command = "yuucu.hunk.open-review"
description = "Hunk review"
